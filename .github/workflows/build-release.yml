name: Windows build and release
on:
  push:
    branches: [main, 'feature/last-light-redux-experimental']
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: metro-nr-release-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @('MetroNR-Manager.ps1','MetroNR-Worker.ps1','Install.ps1','Uninstall.ps1','NRRuntime.ps1','GamePath.ps1','Build.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "PowerShell syntax validation failed: $path"
            }
            Write-Host "Syntax OK: $path"
          }
      - name: Compile Windows x64 proxy
        shell: pwsh
        run: .\Build.ps1
      - name: Package user installation
        shell: pwsh
        run: |
          $stage = '_release'
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'build') | Out-Null
          Copy-Item build/dinput8.dll (Join-Path $stage 'build/dinput8.dll')
          $files = @('README.md','LICENSE','THIRD_PARTY.md','GamePath.ps1','NRRuntime.ps1','MetroNR-Manager.ps1','MetroNR-Worker.ps1','Install.cmd','Install.ps1','EnableDirect.cmd','EnableDirect.ps1','DisableDirect.cmd','DisableDirect.ps1','Uninstall.cmd','Uninstall.ps1','Report.cmd','Report.ps1','LastLight-Test.cmd','LastLight-Report.cmd','LastLight-Uninstall.cmd')
          foreach ($file in $files) { Copy-Item $file $stage }
          $safeRef = "${{ github.ref_name }}".Replace("/","-")
          Compress-Archive -Path "$stage/*" -DestinationPath "Metro-NR-RTX40-$safeRef-win-x64.zip" -Force
      - name: Build guided EXE installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Missing Inno Setup at $iscc" }
          & $iscc MetroNR-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed: $LASTEXITCODE" }
          if (!(Test-Path 'build/Metro-NR-RTX40-Setup-v1.0.0-lastlight-preview1.exe')) { throw 'Installer EXE not created' }
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro-nr-lastlight-preview-x64
          path: |
            Metro-NR-RTX40-*-win-x64.zip
            build/Metro-NR-RTX40-Setup-v1.0.0-lastlight-preview1.exe
      - name: Publish release only from main after successful Windows build
        if: false # experimental feature branch: never publish a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'v1.0.0-rc2'
          gh release view $tag *> $null
          $assets = @("Metro-NR-RTX40-${{ github.ref_name }}-win-x64.zip", "build/Metro-NR-RTX40-Setup-v1.0.0-lastlight-preview1.exe")
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag @assets --target "${{ github.sha }}" --title "Metro NR RTX40 v1.0.0 RC2" --generate-notes --prerelease
          } else {
            gh release upload $tag @assets --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish/update RC2 prerelease assets.' }
