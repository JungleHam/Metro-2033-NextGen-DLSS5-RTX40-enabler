name: Windows portable build and release
on:
  push:
    branches: [main, 'feature/last-light-redux-experimental']
  workflow_dispatch:
concurrency:
  group: metro-nr-portable-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          foreach ($path in @('MetroNR-Manager.ps1','MetroNR-Worker.ps1','Install.ps1','Uninstall.ps1','NRRuntime.ps1','GamePath.ps1','Build.ps1','Report.ps1','tools/Build-Portable.ps1')) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host $_ -ForegroundColor Red }
              throw "PowerShell syntax validation failed: $path"
            }
            Write-Host "Syntax OK: $path"
          }
      - name: Verify Game dropdown has no overlapping label
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath 'MetroNR-Manager.ps1' -Raw
          $label = [regex]::Match($source, "Label 'Game' (?<x>\d+) (?<y>\d+) (?<width>\d+)")
          $combo = [regex]::Match($source, '\$gameChoice.Location=New-Object System.Drawing.Point\((?<x>\d+),(?<y>\d+)\)')
          $items = [regex]::Matches($source, '\$gameChoice.Items.Add\(')
          if (-not $label.Success -or -not $combo.Success -or $items.Count -ne 2) { throw 'Could not validate game dropdown layout.' }
          if (([int]$label.Groups['x'].Value + [int]$label.Groups['width'].Value) -ge [int]$combo.Groups['x'].Value) {
            throw 'Game label overlays the game dropdown.'
          }
          Write-Host 'Game dropdown label does not overlap.' -ForegroundColor Green
      - name: Compile Windows x64 proxy
        shell: pwsh
        run: .\Build.ps1
      - name: Assemble minimal portable payload
        shell: pwsh
        run: |
          $stage = '_release'
          New-Item -ItemType Directory -Force $stage | Out-Null
          New-Item -ItemType Directory -Force (Join-Path $stage 'build') | Out-Null
          Copy-Item build/dinput8.dll (Join-Path $stage 'build/dinput8.dll')
          $files = @('README.md','LICENSE','THIRD_PARTY.md','GamePath.ps1','NRRuntime.ps1','MetroNR-Manager.ps1','MetroNR-Worker.ps1','Install.ps1','Uninstall.ps1')
          foreach ($file in $files) { Copy-Item $file $stage }
          if ((Get-ChildItem -Path $stage -Recurse -File | Where-Object { $_.Extension -eq '.cmd' -or $_.Extension -eq '.iss' }).Count) {
            throw 'Portable payload contains obsolete launcher/setup files'
          }
      - name: Build one portable EXE
        shell: pwsh
        run: |
          .\tools\Build-Portable.ps1 -Version 'v1.0.0-preview3'
          if (!(Test-Path -LiteralPath 'build/Metro-NR-RTX40-Portable-v1.0.0-preview3.exe')) {
            throw 'Portable EXE not created'
          }
      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: metro-nr-portable-preview3-x64
          path: build/Metro-NR-RTX40-Portable-v1.0.0-preview3.exe
      - name: Publish Preview 3 from main after successful build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = 'v1.0.0-portable-preview3'
          $asset = 'build/Metro-NR-RTX40-Portable-v1.0.0-preview3.exe'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --target "${{ github.sha }}" --title "Metro Redux NR Portable Preview 3" --notes "One portable EXE supports installation, updates and uninstall for Metro 2033 Redux and Metro Last Light Redux. Removed old setup wrappers, cleaned up repository and README. Includes the working Preview 2 dropdown layout fix. Experimental community release." --prerelease
          } else {
            gh release upload $tag $asset --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish Portable Preview 3.' }
